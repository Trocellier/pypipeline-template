version: '3.8'

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: pypipeline
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./config.yml:/app/config.yml:ro
      - ./.env:/app/.env:ro
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - pipeline_network

  # Optional: Database service (if needed)
  # db:
  #   image: postgres:15-alpine
  #   container_name: pipeline_db
  #   environment:
  #     - POSTGRES_DB=pipeline_db
  #     - POSTGRES_USER=user
  #     - POSTGRES_PASSWORD=password
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   networks:
  #     - pipeline_network

networks:
  pipeline_network:
    driver: bridge

volumes:
  db_data:
