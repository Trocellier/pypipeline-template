services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pypipeline
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./config.yml:/app/config.yml:ro
    depends_on:
      - db
    restart: on-failure:5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - pipeline_network

  # db service is commented out. Uncomment and configure if you need a PostgreSQL database.
  # db:
  #   image: postgres:16-alpine
  #   container_name: pipeline_db
  #   environment:
  #     - POSTGRES_DB=pipeline_db
  #     - POSTGRES_USER=user
  #     - POSTGRES_PASSWORD=password
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   networks:
  #     - pipeline_network

networks:
  pipeline_network:
    driver: bridge

volumes:
  db_data: